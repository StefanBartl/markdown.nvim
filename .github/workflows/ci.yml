name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests (headless) (${{ matrix.os }})
    runs-on: ${{{{ matrix.os }}}}
    strategy:
      # One platform failing must not cancel the others: which of the three
      # broke is the whole information content of this job.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        # Windows runners default to PowerShell; one shell on all three keeps
        # the run step itself from being what differs between platforms.
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          path: markdown.nvim
      # markdown.nvim depends on lib.nvim at runtime (bindings/usrcmds.lua's
      # command layer, core/table_mode.lua's buffer debouncing) -- TESTS/run.lua
      # hard-fails without it on the runtimepath, and picks it up via
      # $LIB_NVIM_PATH.
      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/lib.nvim
          path: lib.nvim
          ref: ci-verified
      # hover.nvim is the hover framework; markdown.hover only contributes a
      # source, and hover_spec.lua requires hover.* modules directly.
      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/hover.nvim
          path: hover.nvim
          ref: ci-verified
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      # file_refs_spec.lua exercises the rg-backed search path and hard-fails
      # if rg isn't on PATH -- the ubuntu-latest runner image doesn't
      # guarantee ripgrep, so install it explicitly.
      - name: Install ripgrep
        run: |
          # `rg` is a real dependency of these specs, not a convenience -- they
          # shell out to it. The install is the one step that has to differ per
          # runner image; everything after it is identical on all three. The
          # `rg --version` at the end is the actual gate: if a package manager
          # silently no-ops, the suite must not start and then fail obscurely.
          case "${{ runner.os }}" in
            Linux)   sudo apt-get update && sudo apt-get install -y ripgrep ;;
            macOS)   brew install ripgrep || true ;;
            Windows) choco install ripgrep -y --no-progress ;;
          esac
          rg --version
      - name: Run TESTS suite
        working-directory: markdown.nvim
        env:
          LIB_NVIM_PATH: ${{ github.workspace }}/lib.nvim
          HOVER_NVIM_PATH: ${{ github.workspace }}/hover.nvim
        run: nvim --headless -i NONE -u NONE -c "set rtp+=." -c "luafile TESTS/run.lua" -c "qa!"

  lint:
    name: lint (stylua + luacheck)
    runs-on: ubuntu-latest
    # Was advisory pending the one-time `stylua .` + luacheck cleanup. Both
    # have landed and run clean, so this is a real gate again -- otherwise the
    # formatting simply drifts back.
    steps:
      - uses: actions/checkout@v5
      - name: stylua --check
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check .
      - name: luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua-check
          luacheck lua
